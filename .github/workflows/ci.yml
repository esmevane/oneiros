name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v6
      - &install-rust
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - &cache
        name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - &check
        name: Run cargo check
        run: cargo check --workspace --all-targets

  check-windows:
    name: Check (Windows)
    runs-on: windows-latest
    steps:
      - *checkout
      - *install-rust
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - *check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - *checkout
      - *install-rust
      - *cache
      - name: Install cargo test deps
        run: cargo test --workspace --all-targets --no-run
      - name: Run cargo test
        run: cargo test --workspace --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: check
    steps:
      - *checkout
      - *install-rust
      - *cache
      - *check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *install-rust
      - *check
      - name: Check formatting
        run: cargo fmt --all --check

  js-check:
    name: JS (format + lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
